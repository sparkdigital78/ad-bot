name: Check Advanced Credits

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-credits:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Virtual Display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install playwright
          playwright install chromium

      - name: Run Advanced Credits Check (All Accounts)
        env:
          ALL_EMAILS: ${{ secrets.ALL_EMAILS }}
          ACCOUNT_PASSWORD: ${{ secrets.ACCOUNT_PASSWORD }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python -u check_credits.py

      - name: Save Updated Credit Report to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add advanced_credits_report.txt
          git commit -m "Update advanced_credits_report.txt with latest run results" || exit 0
          git push
          
