name: Run Daily Ad Bot Parallel

on:
  workflow_dispatch:
    inputs:
      shards_count:
        description: 'Number of parallel shards (Enter any number from 1 to 20)'
        required: true
        default: '20'

permissions: write-all

concurrency:
  group: daily-ad-bot-matrix
  cancel-in-progress: false

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          RAW_COUNT="${{ github.event.inputs.shards_count }}"
          if ! [[ "$RAW_COUNT" =~ ^[0-9]+$ ]]; then
            RAW_COUNT=20
          fi
          
          if [ "$RAW_COUNT" -lt 1 ]; then
            COUNT=1
          elif [ "$RAW_COUNT" -gt 20 ]; then
            COUNT=20
          else
            COUNT=$RAW_COUNT
          fi

          SHARDS=$(python3 -c "import json; print(json.dumps(list(range(1, $COUNT + 1))))")
          echo "matrix={\"shard\":$SHARDS, \"total_shards\":[$COUNT]}" >> $GITHUB_OUTPUT

  run-automation:
    needs: setup-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    timeout-minutes: 340
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python & Node
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System & VNC Tools
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends \
            xvfb x11vnc novnc websockify openssh-client

      - name: Install Python & Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright requests
          playwright install --with-deps chromium

      - name: Start Live Web VNC Stream
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          sleep 2
          
          x11vnc -display :99 -forever -shared -rfbport 5900 -nopw &
          sleep 2
          
          /usr/share/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080 &
          sleep 3
          
          # Establish tunnel via Pinggy over SSH (avoids localtunnel blocks)
          ssh -p 443 -R0:localhost:6080 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 a.pinggy.io > pinggy.log 2>&1 &
          sleep 6
          
          TUNNEL_URL=$(grep -o 'https://[^" ]*' pinggy.log | head -n 1)
          HOST_DOMAIN=${TUNNEL_URL#https://}
          
          echo "=========================================================="
          echo "LIVE STREAM URL (SHARD ${{ matrix.shard }}/${{ matrix.total_shards }}):"
          echo "${TUNNEL_URL}/vnc.html?host=${HOST_DOMAIN}&port=443"
          echo "=========================================================="

      - name: Run Script (Shard ${{ matrix.shard }}/${{ matrix.total_shards }})
        env:
          ACCOUNT_PASSWORD: ${{ secrets.ACCOUNT_PASSWORD }}
          DISPLAY: ":99"
          SHARD_INDEX: ${{ matrix.shard }}
          TOTAL_SHARDS: ${{ matrix.total_shards }}
        run: python -u bot.py

      - name: Upload Execution Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-videos-shard-${{ matrix.shard }}-${{ github.run_number }}
          path: videos/
          retention-days: 7
