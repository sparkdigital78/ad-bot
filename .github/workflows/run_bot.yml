name: Run Daily Ad Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '5 16 * * *' # Auto-runs daily at 9:35 PM IST (16:05 UTC)

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python & VNC Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc novnc websockify

      - name: Start Live Web VNC Stream
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          sleep 2
          
          x11vnc -display :99 -forever -shared -rfbport 5900 -nopw &
          sleep 2
          
          /usr/share/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080 &
          sleep 2
          
          ssh -p 443 -R0:localhost:6080 -o StrictHostKeyChecking=no a.pinggy.io > pinggy.log 2>&1 &
          sleep 5
          
          BASE_URL=$(cat pinggy.log | grep -o 'https://[^" ]*' | head -n 1)
          echo "=========================================================="
          echo "LIVE STREAM URL:"
          echo "${BASE_URL}/vnc.html"
          echo "=========================================================="

      - name: Run Script
        env:
          ACCOUNT_PASSWORD: ${{ secrets.ACCOUNT_PASSWORD }}
          DISPLAY: ":99"
        run: python -u bot.py

      - name: Upload Execution Videos
        if: always() # Uploads video artifact on success, failure, OR manual cancel
        uses: actions/upload-artifact@v4
        with:
          name: execution-videos
          path: videos/
          retention-days: 7
