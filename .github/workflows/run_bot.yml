name: Run Daily Ad Bot

on:
  workflow_dispatch:

permissions: write-all

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 340 # 5 hours 40 minutes limit
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python & Node
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python & VNC Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright requests
          playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc novnc websockify npm
          sudo npm install -g localtunnel

      - name: Start Live Web VNC Stream
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          sleep 2
          
          x11vnc -display :99 -forever -shared -rfbport 5900 -nopw &
          sleep 2
          
          /usr/share/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080 &
          sleep 3
          
          lt --port 6080 > lt.log 2>&1 &
          sleep 5
          
          TUNNEL_URL=$(grep -o 'https://[^" ]*' lt.log | head -n 1)
          echo "=========================================================="
          echo "LIVE STREAM URL:"
          echo "${TUNNEL_URL}/vnc.html?host=${TUNNEL_URL#https://}&port=443"
          echo "=========================================================="

      - name: Run Script
        env:
          ACCOUNT_PASSWORD: ${{ secrets.ACCOUNT_PASSWORD }}
          DISPLAY: ":99"
        run: python -u bot.py

      - name: Commit Updated Progress State
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git fetch origin main || true
          git rebase origin/main || true
          
          if [ -f completed_accounts.txt ]; then git add completed_accounts.txt; fi
          if [ -f ALL_DONE.txt ]; then git add ALL_DONE.txt; fi
          
          if git status --porcelain | grep -E "completed_accounts.txt|ALL_DONE.txt"; then
            git commit -m "update: saved completed accounts progress"
            git push origin HEAD:main --force-with-lease || git push origin HEAD:main
          else
            echo "No progress state changes to commit."
          fi

      - name: Upload Execution Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-videos-${{ github.run_number }}
          path: videos/
          retention-days: 7

      # RUN ALWAYS ON TIMEOUT (check_status.py checks for manual cancels vs normal timeouts)
      - name: Auto-Chain Next Run If Accounts Remaining
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python check_status.py
        
